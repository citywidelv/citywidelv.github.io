<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Report History | Kens Hub</title>
<!-- build 2026-10-24: the report history, one page for every tier. The page sends whichever passcode the device holds
     (team unlock from cw-auth.js, then the manager passcode, then the client passcode) and the backend scopes the
     rows to that role (kind kh_history). ?who=client forces the client view on a City Wide device. Hub rows and the
     three Jotforms' rows are merged, grouped by day and shift. Tap a row for the task-by-task detail (kh_get). -->
<link rel="icon" type="image/png" sizes="32x32" href="https://citywidelv.github.io/cw-ops-desk/favicon-32x32.png">
<link rel="stylesheet" href="kh.css">
<style>
.brands img.ovl{height:30px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.filters .chip{min-height:38px;padding:7px 12px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 16px}
.stat{background:#fff;border:1px solid var(--ov-border);border-radius:10px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--ov-olive);line-height:1.1}
.stat span{font-size:10px;color:var(--grey);text-transform:uppercase;letter-spacing:.05em}
@media(max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}}
.dayh{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--black);border-bottom:2px solid var(--red);padding:0 0 5px;margin:18px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.dayh span{font-weight:400;text-transform:none;letter-spacing:0;color:var(--grey);font-size:12px}
.shifth{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--grey);margin:10px 0 4px}
.row{display:flex;align-items:flex-start;gap:12px;background:#fff;border:1px solid var(--border);border-left:4px solid var(--ok);border-radius:0 10px 10px 0;padding:10px 12px;margin-bottom:6px;cursor:pointer;min-height:52px}
.row.warn{border-left-color:var(--gold)}
.row.report{border-left-color:var(--ov-olive)}
.row.em{border-left-color:var(--red);background:var(--warnbg)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:14px;line-height:1.3}
.row .t small{display:block;font-size:12px;color:var(--grey);margin-top:2px;line-height:1.35}
.row .t .iss{color:var(--red);font-weight:700}
.row .m{flex:none;text-align:right;font-size:12px;color:var(--grey);line-height:1.3}
.row .m b{display:block;color:var(--black);font-size:13px}
.src{display:inline-block;font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px;background:var(--light);color:var(--grey);margin-left:4px;vertical-align:middle}
.detail dl{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;font-size:13px;margin:0 0 10px}
.detail dt{color:var(--grey)}.detail dd{font-weight:700}
.detail .tk{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--light);font-size:13px}
.detail .tk .a{flex:none;width:52px;font-weight:700;color:var(--ok)}
.detail .tk .a.no{color:var(--red)}
.detail .tk .a.na{color:var(--grey);font-weight:400}
.detail h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--grey);margin:12px 0 2px}
.detail .ph img{width:100%;border-radius:8px;border:1px solid var(--border);margin-top:8px}
.empty{color:var(--grey);font-size:14px;padding:30px 0;text-align:center}
</style>
<link rel="stylesheet" href="https://citywidelv.github.io/cw-base.css">
</head>
<body>
<header class="top">
<div class="bar">
<a class="back" id="back" href="index.html">&larr; Kens Hub</a>
<div class="brands"><img class="cw" src="https://emailer.emfluence.com/clients/citywide/uploadedfiles/signature_logo.png" alt="City Wide Facility Solutions"><span class="div"></span><img class="ovl" src="kens-logo.jpg" alt="Ken's Foods"></div>
<div class="tag"><b>Report History</b>Kens Hub</div>
</div>
</header>

<main class="wrap">
<h1>Report history</h1>
<div class="lead" id="lead">Every area round and end-of-shift report at Ken's Foods Las Vegas, newest first. Tap one for the detail.</div>

<div class="filters">
<button type="button" class="chip on" data-days="7">Last 7 days</button><button type="button" class="chip" data-days="14">14 days</button><button type="button" class="chip" data-days="30">30 days</button>
<span style="flex:1"></span>
<button type="button" class="chip" data-type="">All</button><button type="button" class="chip" data-type="area">Area rounds</button><button type="button" class="chip" data-type="shift">End of shift</button><button type="button" class="chip" data-type="report">Messages</button>
<button type="button" class="chip" id="issues">Issues only</button>
</div>
<div class="stats" id="stats"></div>
<div id="list"><div class="empty">Loading...</div></div>
</main>

<footer class="foot"><span class="line">City Wide Facility Solutions, Las Vegas &middot; <a href="tel:7024831874">702-483-1874</a></span></footer>

<script src="kh-shared.js"></script>
<script>
(function(){
var $ = KH.$, esc = KH.esc, P = KH.params();
/* Which passcode does this device hold? Highest tier wins unless ?who=client. */
var pass = "", tier = "client";
if(P.who !== "client" && KH.getTeam()){ pass = KH.getTeam(); tier = "team"; }
else if(P.who !== "client" && KH.mgrGetPass()){ pass = KH.mgrGetPass(); tier = "manager"; }
else { pass = KH.require(); if(!pass) return; }
if(tier === "manager") $("back").href = "manager.html"; else if(tier === "team") $("back").href = "review.html"; else if(P.from === "porter") $("back").href = "porter.html"; else $("back").href = "client.html";
var api = function(kind, body){ body = body || {}; body.kind = kind; body.passcode = pass; return KH.post(body); };

var F = { days:7, type:"", issues:false }, DATA = [];
/* Paint from the last result on this device at once, then refresh from the server in the background. */
function ckey(){ return "cwKhHist_" + tier + "_" + F.days; }
function load(){
  var cached = null; try { cached = JSON.parse(localStorage.getItem(ckey()) || "null"); } catch(e){}
  if(cached && cached.items){ DATA = cached.items; render(); $("lead").setAttribute("data-stale", "1"); stamp(cached.at, true); }
  else $("list").innerHTML = '<div class="empty">Loading...</div>';
  api("kh_history", { days:F.days }).then(function(r){
    if(!r || !r.ok) throw new Error((r && r.error) || "Could not load");
    DATA = r.items || []; render(); var at = new Date().toISOString(); stamp(at, false);
    try { localStorage.setItem(ckey(), JSON.stringify({ at:at, items:DATA })); } catch(e){}
  }).catch(function(e){ var m = String(e && e.message || e); if(/passcode/i.test(m) && tier === "client") return KH.locked(m); if(!cached) $("list").innerHTML = '<div class="note warn">' + esc(m) + '</div>'; else stamp(cached.at, true, m); });
}
function stamp(at, stale, err){ var el = $("stamp"); if(!el){ el = document.createElement("div"); el.id = "stamp"; el.style.cssText = "font-size:11px;color:var(--grey);margin:-8px 0 10px"; $("stats").parentNode.insertBefore(el, $("stats")); } el.textContent = (stale ? "Showing what loaded " + KH.fmtDate(at) + (err ? ", could not refresh: " + err : ", refreshing...") : "Updated " + KH.fmtDate(at)); }
function hasIssue(x){ return x.type === "report" ? !!x.emergency : (Number(x.no) > 0 || Number(x.late) > 0); }
function render(){
  var items = DATA.filter(function(x){ return (!F.type || x.type === F.type) && (!F.issues || hasIssue(x)); });
  var areas = items.filter(function(x){ return x.type === "area"; }), shifts = items.filter(function(x){ return x.type === "shift"; });
  var yes = 0, tot = 0; areas.concat(shifts).forEach(function(x){ yes += Number(x.yes) || 0; tot += Number(x.total) || 0; });
  $("stats").innerHTML = [["Area rounds", areas.length], ["Shift reports", shifts.length], ["Tasks done", tot ? yes + " / " + tot : "0"], ["With an issue", items.filter(hasIssue).length]].map(function(s){ return '<div class="stat"><b>' + esc(s[1]) + '</b><span>' + esc(s[0]) + '</span></div>'; }).join("");
  if(!items.length){ $("list").innerHTML = '<div class="empty">Nothing in this window.</div>'; return; }
  var days = {}, order = [];
  items.forEach(function(x){ var d = x.day || "Undated"; if(!days[d]){ days[d] = []; order.push(d); } days[d].push(x); });
  var h = "";
  order.forEach(function(d){
    var list = days[d];
    h += '<div class="dayh">' + esc(d === "Undated" ? d : KH.niceDay(d)) + '<span>' + list.length + ' item' + (list.length === 1 ? '' : 's') + '</span></div>';
    ["1st Shift", "2nd Shift", "3rd Shift", ""].forEach(function(sh){
      var sub = list.filter(function(x){ return (x.shift || "") === sh; });
      if(!sub.length) return;
      if(sh) h += '<div class="shifth">' + esc(sh) + '</div>';
      sub.forEach(function(x){ h += rowHtml(x); });
    });
  });
  $("list").innerHTML = h;
  $("list").querySelectorAll("[data-id]").forEach(function(el){ el.addEventListener("click", function(){ openItem(el.getAttribute("data-id")); }); });
}
function rowHtml(x){
  var cls = x.type === "report" ? (x.emergency ? "em" : "report") : (hasIssue(x) ? "warn" : "");
  var title, sub;
  if(x.type === "area"){ title = x.area + (x.round ? " · " + x.round + " round" : ""); sub = (x.porter ? esc(x.porter) + " · " : "") + x.yes + " of " + x.total + " tasks done" + (x.issues ? ' · <span class="iss">Not done: ' + esc(String(x.issues).slice(0, 160)) + '</span>' : "") + (x.notes ? " · " + esc(String(x.notes).slice(0, 120)) : ""); }
  else if(x.type === "shift"){ title = x.shift + " end of shift"; sub = (x.porter ? esc(x.porter) + " · " : "") + x.yes + " of " + x.total + " stops done" + (x.late ? ', <span class="iss">' + x.late + " late</span>" : "") + (x.issues ? ' · <span class="iss">' + esc(String(x.issues).slice(0, 160)) + '</span>' : "") + (x.notes ? " · " + esc(String(x.notes).slice(0, 120)) : ""); }
  else { title = (x.emergency ? "EMERGENCY · " : "") + x.mode + (x.category && x.category !== x.mode ? ": " + x.category : ""); sub = (x.area ? esc(x.area) + " · " : "") + (x.submitter ? esc(x.submitter) + " · " : "") + esc(String(x.summary || "").slice(0, 160)); }
  return '<div class="row ' + cls + '" data-id="' + esc(x.id) + '"><div class="t"><b>' + esc(title) + (x.src === "jotform" ? '<span class="src">Jotform</span>' : '') + '</b><small>' + sub + '</small></div><div class="m"><b>' + esc(KH.fmtTime(x.created_at)) + '</b>' + (x.photos ? x.photos + ' photo' + (x.photos == 1 ? '' : 's') : '') + '</div></div>';
}
function openItem(id){
  var m = document.createElement("div"); m.className = "modal"; m.innerHTML = '<div class="box detail"><div class="empty">Loading...</div></div>';
  document.body.appendChild(m); m.addEventListener("click", function(e){ if(e.target === m) m.remove(); });
  api("kh_get", { id:id }).then(function(r){
    if(!r || !r.ok) throw new Error((r && r.error) || "Could not load");
    var d = r.doc, box = m.querySelector(".box"), h = '<h3>' + esc(d.area_name || d.area || (d.shift_name || d.shift) || d.mode || "Item") + '</h3>';
    if(r.type === "area"){
      h += '<dl><dt>Round</dt><dd>' + esc(d.round || "") + '</dd><dt>Shift</dt><dd>' + esc(d.shift_name || d.shift || "") + '</dd><dt>Porter</dt><dd>' + esc(d.porter || "") + '</dd><dt>Logged</dt><dd>' + esc(KH.fmtDate(d.created_at)) + '</dd></dl>';
      var groups = { every:"Every visit", daily:"Thorough round tasks", periodic:"Weekly / monthly (done today)", other:"Tasks" };
      ["every", "daily", "periodic", "other"].forEach(function(f){
        var list = (d.tasks || []).filter(function(t){ return (t.f || "other") === f && (f !== "periodic" || t.a); });
        if(!list.length) return;
        h += '<h4>' + groups[f] + '</h4>' + list.map(function(t){ var a = String(t.a || ""); var cls = a === "Yes" ? "" : a === "No" ? "no" : "na"; return '<div class="tk"><div class="a ' + cls + '">' + esc(a === "Yes" || a === "No" ? a : (a ? "" : "n/a")) + '</div><div>' + esc(String(t.q).replace(/\s*\(.*\)\s*$/, "")) + (a && a !== "Yes" && a !== "No" ? '<div style="color:var(--grey);font-size:12px">' + esc(a) + '</div>' : '') + '</div></div>'; }).join("");
      });
      if(d.notes) h += '<h4>Notes</h4><div style="font-size:13px;white-space:pre-wrap">' + esc(d.notes) + '</div>';
    } else if(r.type === "shift"){
      h += '<dl><dt>Porter</dt><dd>' + esc(d.porter || "") + '</dd><dt>Date</dt><dd>' + esc(d.service_date || d.day || "") + '</dd><dt>Logged</dt><dd>' + esc(KH.fmtDate(d.created_at)) + '</dd></dl><h4>Scheduled stops</h4>';
      (d.stops || []).forEach(function(s){ var done = /^yes/i.test(s.done), late = done && /^no/i.test(s.on_time); h += '<div class="tk"><div class="a ' + (!done ? "no" : late ? "no" : "") + '">' + (done ? (late ? "Late" : "Done") : (s.done ? "Not done" : "")) + '</div><div>' + esc((s.t ? s.t + " " : "") + s.what) + (s.why ? '<div style="color:var(--red);font-size:12px">' + esc(s.why) + '</div>' : '') + '</div></div>'; });
      if(d.notes) h += '<h4>Notes</h4><div style="font-size:13px;white-space:pre-wrap">' + esc(d.notes) + '</div>';
    } else {
      h += '<dl>' + (d.submitter ? '<dt>From</dt><dd>' + esc([d.submitter, d.role].filter(Boolean).join(", ")) + '</dd>' : '') + (d.phone || d.email ? '<dt>Contact</dt><dd>' + esc([d.phone, d.email].filter(Boolean).join(" · ")) + '</dd>' : '') + '<dt>Type</dt><dd>' + esc((d.mode || "") + (d.category ? ": " + d.category : "")) + '</dd><dt>Area</dt><dd>' + esc(d.area_name || d.area || "") + '</dd>' + (d.urgency ? '<dt>Urgency</dt><dd>' + esc(d.urgency) + '</dd>' : '') + '<dt>Logged</dt><dd>' + esc(KH.fmtDate(d.created_at)) + '</dd><dt>Status</dt><dd>' + esc(d.status || "") + '</dd></dl>';
      h += '<div style="font-size:14px;white-space:pre-wrap">' + esc(d.notes || d.summary || "") + '</div>';
      (d.answers || []).forEach(function(a){ var v = Array.isArray(a.a) ? a.a.join(", ") : a.a; if(v) h += '<h4>' + esc(a.q) + '</h4><div style="font-size:13px">' + esc(v) + '</div>'; });
    }
    if(d.cw_notes) h += '<h4>City Wide notes</h4><div style="font-size:13px;white-space:pre-wrap">' + esc(d.cw_notes) + '</div>';
    if(d.photo_url) h += '<h4>Photo</h4><a href="' + esc(d.photo_url) + '" target="_blank" rel="noopener">Open the photo on Jotform</a>';
    var files = r.photo_files || {}, pids = Object.keys(files);
    if(pids.length) h += '<h4>Photos</h4><div class="ph" id="phs"></div>';
    h += '<div class="btnrow" style="margin-top:14px"><button type="button" class="btn ghost" id="close">Close</button></div>';
    box.innerHTML = h; $("close").addEventListener("click", function(){ m.remove(); });
    pids.forEach(function(pid){ api("kh_photo_get", { fileId: files[pid] }).then(function(pr){ if(pr && pr.ok){ var img = document.createElement("img"); img.src = pr.data; $("phs").appendChild(img); } }); });
  }).catch(function(e){ m.querySelector(".box").innerHTML = '<div class="note warn">' + esc(String(e && e.message || e)) + '</div><div class="btnrow"><button type="button" class="btn ghost" id="close">Close</button></div>'; $("close").addEventListener("click", function(){ m.remove(); }); });
}
document.querySelectorAll("[data-days]").forEach(function(b){ b.addEventListener("click", function(){ document.querySelectorAll("[data-days]").forEach(function(x){ x.classList.remove("on"); }); b.classList.add("on"); F.days = Number(b.getAttribute("data-days")); load(); }); });
document.querySelectorAll("[data-type]").forEach(function(b){ b.addEventListener("click", function(){ document.querySelectorAll("[data-type]").forEach(function(x){ x.classList.remove("on"); }); b.classList.add("on"); F.type = b.getAttribute("data-type"); render(); }); });
$("issues").addEventListener("click", function(){ F.issues = !F.issues; $("issues").classList.toggle("on", F.issues); render(); });
if(tier !== "client") $("lead").textContent = (tier === "team" ? "City Wide view: " : "Manager view: ") + "everything logged at the plant, hub and Jotform, newest first.";
load();
})();
</script>
</body>
</html>
